# Auth front door for the NAS-hosted AuthorAgent gateway (ALP-1725).
#
# The gateway itself is unauthenticated, so this proxy is the security boundary,
# not a convenience. Everything except the liveness probe requires basic auth.

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # socket.io needs a real Upgrade passthrough; a hardcoded `Connection:
  # upgrade` would break plain polling requests, hence the map.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream authoragent {
    server authoragent:3847;
  }

  server {
    listen 8080;
    server_name _;

    # Manuscript/cover uploads go through multer; the default 1m rejects them.
    client_max_body_size 100m;

    # Unauthenticated liveness probe only. Returns {status,uptime,version} —
    # no workspace, config, or credential data. deploy-nas.sh verifies against
    # this, and the proxy's own healthcheck uses it.
    location = /healthz {
      proxy_pass http://authoragent/healthz;
      proxy_set_header Host $host;
      access_log off;
    }

    location / {
      auth_basic           "AuthorAgent";
      auth_basic_user_file /etc/nginx/htpasswd;

      proxy_pass http://authoragent;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;

      # A single book-phase call can run for many minutes against a slow model.
      # The default 60s read timeout would sever those mid-generation.
      proxy_connect_timeout 30s;
      proxy_send_timeout    600s;
      proxy_read_timeout    600s;

      # Token-by-token progress is streamed; buffering hides it until the end.
      proxy_buffering off;
    }
  }
}
